name: Deploy

# Every push to main: run the full installer tests, and only if they pass, build the served files
# (install.sh, install.ps1, and <driver> / <driver>.ps1 for each driver, generated from them by
# build-site.sh), upload them as text/plain to the S3 bucket behind CloudFront, invalidate the cache,
# check the live URLs (https, no -L) serve exactly these files and plain http serves only the
# https-only stub, and run the one-liners.
#
# AWS access is GitHub OIDC to the role in the repo variable AWS_DEPLOY_ROLE_ARN, which trusts only
# this repo's main branch (the `sub` claim carries the org and repo IDs:
# repo:gizmodata@181902052/adbc-install@1463434488:ref:refs/heads/main) and may only write the
# bucket and invalidate the distribution. The role, bucket and distribution are in
# gizmodata-infrastructure-terraform, aws/dns/adbc_install.tf.
# No GitHub `environment:` here: it would change the `sub` claim the role trusts.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Queue, never cancel: a deploy cut off between the S3 upload and the invalidation would leave
# the old scripts cached.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  BUCKET: gizmodata-adbc-install
  DISTRIBUTION_ID: E1G81QXOYTFTVR
  HOST: install.adbc.gizmodata.com

jobs:
  tests:
    uses: ./.github/workflows/test-install.yml

  deploy:
    needs: tests
    # x64: the AWS CLI is preinstalled on this image.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      deployments: write
    steps:
      - uses: actions/checkout@v7

      - name: Deployment record (in progress)
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/deployments" -X POST -f ref="$GITHUB_SHA" -f environment=production \
            -F auto_merge=false -f 'required_contexts[]' -f description="the ADBC driver installers to $HOST" --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" -X POST -f state=in_progress >/dev/null

      - name: Build the served files
        run: .github/scripts/build-site.sh site

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: adbc-install-${{ github.run_id }}

      - name: Upload (install.sh is the root object, /)
        run: |
          for f in site/*; do
            aws s3 cp "$f" "s3://$BUCKET/$(basename "$f")" --content-type 'text/plain; charset=utf-8' \
              --cache-control 'public, max-age=300' --metadata "git-sha=$GITHUB_SHA" --only-show-errors
          done
          aws s3 ls "s3://$BUCKET/"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths '/*' \
            --query Invalidation.Id --output text

      # Plain curl with no -L, as the documented one-liners run it. https serves these exact files;
      # plain http never serves a script, only CloudFront's stub (gizmodata-infrastructure-terraform
      # aws/dns/installers_https_only.tf), which prints the https URL and exits non-zero.
      - name: The live URLs serve these exact files (https) and only the stub (http)
        run: |
          check() {
            url="$1"; file="$2"
            code=$(curl -sS -o "$RUNNER_TEMP/body" -D "$RUNNER_TEMP/headers" -w '%{http_code}' "$url") || return 1
            [ "$code" = 200 ] || { echo "$url: HTTP $code"; return 1; }
            grep -qi '^content-type: text/plain' "$RUNNER_TEMP/headers" || { echo "$url: not text/plain"; return 1; }
            cmp -s "$RUNNER_TEMP/body" "$file" || { echo "$url: not this commit's $file yet"; return 1; }
            echo "$url: 200, text/plain, matches $file"
          }
          # http: 200 text/plain, no redirect, and exactly the stub for that path.
          stub() {
            path="$1"
            case "$path" in
              *.ps1) want="throw 'use https://$HOST$path (this installer is served over https only)'" ;;
              *) want="echo 'error: use https://$HOST$path (this installer is served over https only)' >&2; exit 1" ;;
            esac
            url="http://$HOST$path"
            code=$(curl -sS -o "$RUNNER_TEMP/body" -D "$RUNNER_TEMP/headers" -w '%{http_code}' "$url") || return 1
            [ "$code" = 200 ] || { echo "$url: HTTP $code"; return 1; }
            grep -qi '^content-type: text/plain' "$RUNNER_TEMP/headers" || { echo "$url: not text/plain"; return 1; }
            if grep -qi '^location:' "$RUNNER_TEMP/headers"; then echo "$url: redirects"; return 1; fi
            printf '%s\n' "$want" | cmp -s - "$RUNNER_TEMP/body" || { echo "$url: not the https-only stub"; return 1; }
            echo "$url: 200, text/plain, the https-only stub"
          }
          for _ in $(seq 1 60); do
            ok=1
            check "https://$HOST/" site/install.sh || ok=0
            check "https://$HOST" site/install.sh || ok=0
            stub / || ok=0
            for f in site/*; do
              check "https://$HOST/$(basename "$f")" "$f" || ok=0
              stub "/$(basename "$f")" || ok=0
            done
            [ "$ok" = 1 ] && exit 0
            sleep 10
          done
          echo "::error::the live installers didn't match this commit after 10 minutes"
          exit 1

      - name: The served one-liners run
        run: |
          set -u
          # No driver: the list and usage, exit 1.
          if out=$(curl -sS "https://$HOST" | sh 2>&1); then echo "$out"; echo "::error::no driver chosen, yet exit 0"; exit 1; fi
          echo "$out" | grep -F "no driver chosen: pick one of: oracle db2 quack gizmosql chargewire hardcharger"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q adbc-driver-manager==1.13.0
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          # Plain http (and a scheme-less URL, which curl takes as http) runs only the stub: it
          # prints the https URL, exits non-zero, and installs nothing.
          for url in "http://$HOST/oracle" "$HOST/oracle"; do
            if out=$(curl -sS "$url" | sh 2>&1); then echo "$out"; echo "::error::$url | sh exited 0"; exit 1; fi
            echo "$out" | grep -F "error: use https://$HOST/oracle"
          done
          "$RUNNER_TEMP/venv/bin/python" -I .github/scripts/check_driver_by_name.py --driver oracle --absent
          # A real install, in a throwaway HOME, loaded by name.
          curl -sS "https://$HOST/oracle" | sh
          "$RUNNER_TEMP/venv/bin/python" -I .github/scripts/check_driver_by_name.py --driver oracle
          curl -sS "https://$HOST/oracle" | sh -s -- --uninstall
          "$RUNNER_TEMP/venv/bin/python" -I .github/scripts/check_driver_by_name.py --driver oracle --absent

      # One command per line: a failure inside an && list would not stop the step.
      - name: The served one-liners run (as the README has them)
        run: |
          set -u
          export HOME="$RUNNER_TEMP/home2" && mkdir -p "$HOME"
          check() { "$RUNNER_TEMP/venv/bin/python" -I .github/scripts/check_driver_by_name.py "$@"; }
          curl "https://$HOST/oracle" | ADBC_VERSION=1.0.6 sh
          check --driver oracle
          curl "https://$HOST" | sh -s -- oracle
          check --driver oracle
          curl "https://$HOST/oracle" | sh -s -- --name oracle-gizmodata
          check --driver oracle --name oracle-gizmodata
          curl "https://$HOST/oracle" | sh -s -- --name oracle-gizmodata --uninstall
          check --driver oracle --name oracle-gizmodata --absent
          curl "https://$HOST/db2" | sh
          check --driver db2
          curl "https://$HOST/db2" | sh -s -- --uninstall
          check --driver db2 --absent
          curl "https://$HOST/oracle" | sh -s -- --uninstall
          check --driver oracle --absent
          curl "https://$HOST/oracle" | sudo sh -s -- --system
          sudo test -f /etc/adbc/drivers/oracle.toml
          curl "https://$HOST/oracle" | sudo sh -s -- --system --uninstall
          sudo test ! -e /etc/adbc/drivers/oracle.toml

      - name: Deployment record (result)
        if: always() && steps.deployment.outputs.id
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/deployments/${{ steps.deployment.outputs.id }}/statuses" -X POST \
            -f state="$STATE" -f environment_url="https://$HOST" >/dev/null

  # The Windows one-liners from the README, against the live site, under both PowerShells.
  live-windows:
    name: live one-liners (windows-2025)
    needs: deploy
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: The ADBC driver manager
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/Scripts/python" -m pip install -q adbc-driver-manager==1.13.0
          cat > "$RUNNER_TEMP/one-liners.ps1" <<'EOF'
          $ErrorActionPreference = 'Stop'
          $py = "$env:RUNNER_TEMP\venv\Scripts\python.exe"
          function Check([string[]]$a) { & $py -I .github\scripts\check_driver_by_name.py @a; if ($LASTEXITCODE) { exit 1 } }
          irm https://install.adbc.gizmodata.com/oracle.ps1 | iex
          Check @('--driver', 'oracle')
          $env:ADBC_VERSION = '1.0.6'; irm https://install.adbc.gizmodata.com/oracle.ps1 | iex
          Remove-Item Env:\ADBC_VERSION
          Check @('--driver', 'oracle')
          & ([scriptblock]::Create((irm https://install.adbc.gizmodata.com/oracle.ps1))) -Uninstall
          Check @('--driver', 'oracle', '--absent')
          EOF
      - name: PowerShell 7
        shell: pwsh
        run: '& "$env:RUNNER_TEMP\one-liners.ps1"'
      - name: Windows PowerShell 5.1
        shell: powershell
        run: |
          & "$env:RUNNER_TEMP\one-liners.ps1"
          exit $LASTEXITCODE
